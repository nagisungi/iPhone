<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KWH의 iPhone</title>
<style>
:root{--page:#e6e4ec;--ink:#0f0f0f;--mute:#606060;--blank:#e9e9eb;--line:#e5e5e5}
@media (prefers-color-scheme:dark){:root{--page:#141318}}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--page);display:flex;align-items:center;justify-content:center;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",Roboto,sans-serif;color:var(--ink)}
#frame{width:392px;height:820px;max-height:100vh;background:#000;border-radius:58px;padding:12px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
#phone{position:relative;width:100%;height:100%;border-radius:46px;overflow:hidden;background:#fff}
@media (max-width:500px){#frame{width:100%;height:100dvh;max-height:none;border-radius:0;padding:0;box-shadow:none}#phone{border-radius:0}}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:104px;height:30px;border-radius:20px;background:#000;z-index:9}
.status{position:absolute;top:0;left:0;right:0;height:52px;padding:18px 34px 0;display:flex;justify-content:space-between;font-size:16px;font-weight:600;z-index:8;pointer-events:none;background:#fff}
.status span{display:flex;gap:6px;align-items:center}
.sig{display:inline-flex;gap:2px;align-items:flex-end;height:12px}
.sig i{width:3px;background:currentColor;border-radius:1px}
.bat{background:#000;color:#fff;border-radius:6px;padding:0 4px;font-size:11px;line-height:15px;letter-spacing:-.3px}
.status span{gap:5px}
.screen{position:absolute;inset:0;display:none;flex-direction:column;padding-top:52px;background:#fff}
.screen.on{display:flex}
.scroll{flex:1;overflow-y:auto;padding-bottom:96px}
svg{display:block}
.ic{width:24px;height:24px;fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.blank{background:var(--blank)}

/* top bars */
.bar{display:flex;align-items:center;justify-content:space-between;padding:6px 16px;height:48px}
.logo img{height:22px;width:auto;display:block}
.right{display:flex;gap:18px;align-items:center}
.tabs{display:flex;gap:22px;padding:6px 16px 0;border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap}
.tabs span{padding:8px 2px 10px;font-size:15px;color:var(--mute);border-bottom:3px solid transparent}
.tabs span.on{color:var(--ink);font-weight:600;border-color:var(--ink)}

/* home feed */
.thumb{position:relative;aspect-ratio:16/9;margin-top:8px}
.dur{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.8);color:#fff;font-size:12px;font-weight:600;padding:2px 6px;border-radius:5px}
.meta{display:flex;gap:12px;padding:12px 12px 16px;align-items:flex-start}
.ch{width:36px;height:36px;border-radius:50%;flex:none}
.meta h3{flex:1;font-size:15px;font-weight:600;line-height:1.35}
.meta p{font-size:12.5px;color:var(--mute);margin-top:4px;font-weight:400}
.shorts-h{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;font-size:20px;font-weight:700}
.shorts-h span{display:flex;align-items:center;gap:12px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 12px}

/* nav */
.nav{position:absolute;display:flex;align-items:center;justify-content:space-around;z-index:7}
.nav.pill{left:14px;right:14px;bottom:26px;height:64px;background:#fff;border-radius:32px;box-shadow:0 2px 14px rgba(0,0,0,.18);padding:0 8px}
.nav.flat{left:0;right:0;bottom:0;height:88px;background:#f9f9f9;border-top:1px solid var(--line);padding:0 14px 22px}
.nav .it{width:68px;height:48px;border-radius:24px;display:flex;align-items:center;justify-content:center}
.nav .it.act{background:#e9e9eb}
.nav .it svg{width:28px;height:28px}
.nav .it.go:active{background:#e9e9eb}
.me{width:34px;height:34px;border-radius:50%}
.nav .it img.sh{height:25px;width:auto}

/* profile */
.hero{height:140px;margin:6px 14px 0;border-radius:14px}
.who{display:flex;gap:18px;align-items:center;padding:16px 14px 0}
.who .me{width:84px;height:84px;flex:none}
.who h1{font-size:28px;font-weight:800;letter-spacing:.5px}
.who p{font-size:13.5px;color:var(--mute);margin-top:6px}
.own{display:flex;gap:10px;margin:16px 14px 0}
.own button{flex:1;height:40px;border-radius:20px;background:#f2f2f2;font-size:14px;font-weight:600}
.ptabs{display:flex;justify-content:space-between;padding:6px 18px 0;margin-top:14px;border-bottom:1px solid var(--line)}
.ptabs span{padding:10px 4px 12px;font-size:15px;color:var(--mute);border-bottom:3px solid transparent}
.ptabs span.on{color:var(--ink);font-weight:600;border-color:var(--ink)}
.chips{display:flex;gap:10px;padding:14px 14px 6px}
.chips span{padding:7px 14px;border-radius:10px;border:1px solid var(--line);font-size:14px;font-weight:500}
.chips span.on{background:#e9e9eb;border-color:#e9e9eb}
.v{display:flex;gap:14px;padding:10px 14px;align-items:flex-start}
.v .t.blank{background:#000}
.v .t{position:relative;width:158px;aspect-ratio:16/9;border-radius:10px;flex:none}
.v .t .dur{right:6px;bottom:6px;font-size:11.5px}
.v h4{flex:1;font-size:15px;font-weight:500;line-height:1.3}
.v p{font-size:13px;color:var(--mute);margin-top:2px}
.dots{display:flex;gap:3px;padding:8px 2px}
.dots i{width:4px;height:4px;border-radius:50%;background:var(--ink)}

/* watch */
#player{position:relative;aspect-ratio:16/9;background:#000;flex:none;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#vid{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.ctl{position:absolute;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .2s;color:#fff}
.ui .ctl{opacity:1}
.ctl button{color:#fff;display:flex;align-items:center;justify-content:center;pointer-events:none}
.ui .ctl button,.ui #seek{pointer-events:auto}
.ctl svg{fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ctl .top{position:absolute;top:6px;left:6px;right:6px;display:flex;align-items:center;gap:4px}
.ctl .top button{width:40px;height:40px}
.ctl .top svg{width:26px;height:26px}
.ap{width:48px;height:26px;border-radius:13px;background:rgba(255,255,255,.35);display:flex;align-items:center;padding:0 2px;margin-right:6px}
.ap i{width:22px;height:22px;border-radius:50%;background:#e8e8e8;display:flex;align-items:center;justify-content:center;gap:3px}
.ap i b{width:3px;height:9px;background:#555;border-radius:1px}
.mid{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);display:flex;justify-content:center;align-items:center;gap:30px}
.mid button{width:56px;height:56px}
.mid svg{width:42px;height:42px}
#pp svg{width:48px;height:48px;fill:#fff;stroke:none}
#pp svg.re{fill:none;stroke:#fff}
.ctl text{fill:#fff;stroke:none;font-size:7.500px;font-weight:700}
#tm{position:absolute;left:10px;bottom:18px;background:rgba(0,0,0,.45);border-radius:14px;padding:3px 10px;font-size:13.500px;font-weight:600}
#seek{position:absolute;left:0;right:0;bottom:0;height:26px;touch-action:none;pointer-events:none}
#seek .track{position:absolute;left:0;right:0;bottom:7px;height:3px;background:rgba(255,255,255,.35)}
#fill{position:absolute;left:0;bottom:7px;height:3px;background:#f03;width:0}
#knob{position:absolute;bottom:2px;width:13px;height:13px;margin-left:-6.500px;border-radius:50%;background:#f03;left:0}
#mini{position:absolute;left:0;bottom:0;height:2.500px;background:#f03;width:0}
.ui #mini{display:none}
.fl{position:absolute;top:0;bottom:0;width:36%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:rgba(255,255,255,.18);color:#fff;font-size:13px;font-weight:600;opacity:0;pointer-events:none}
.fl.l{left:0;border-radius:0 60% 60% 0}.fl.r{right:0;border-radius:60% 0 0 60%}
.fl.on{animation:fl .6s}
@keyframes fl{0%{opacity:0}15%{opacity:1}70%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.fl.on{animation:none;opacity:1}.ctl{transition:none}}
.d{padding:14px 16px 0}
.d h2{font-size:20px;font-weight:600;line-height:1.3}
.d .m{font-size:13px;color:var(--mute);margin-top:6px;display:flex;flex-wrap:wrap;gap:4px 8px}
.acts{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 0}
.acts .ch{width:44px;height:44px}
.acts .r{display:flex;gap:22px}
.acts .r svg{width:26px;height:26px}
.mintslot svg{width:100%;height:100%}
.cm{margin:16px 12px 0;background:#f2f2f2;border-radius:16px;padding:14px}
.cm b{font-size:15px;font-weight:600}.cm b span{font-weight:400;color:var(--mute);margin-left:4px}
.cm div{display:flex;gap:12px;align-items:center;margin-top:12px}
.cm .ch{width:34px;height:34px}
.cm p{flex:1;background:#e6e6e6;border-radius:18px;padding:9px 14px;font-size:14px;color:var(--mute)}
.fchips{display:flex;gap:8px;padding:14px 12px 0;overflow-x:auto;white-space:nowrap}
.fchips span{padding:8px 13px;border-radius:9px;background:#f2f2f2;font-size:14px;font-weight:500}
.fchips span.on{background:#0f0f0f;color:#fff}
.rel .th{position:relative;aspect-ratio:16/9;background:#000;margin-top:14px}
.rel .meta{padding:10px 12px 4px}
.rel .meta .ch{width:40px;height:40px}
.v[data-play]{cursor:pointer}
.scroll,.tabs,.fchips{scrollbar-width:none;-ms-overflow-style:none}
.scroll::-webkit-scrollbar,.tabs::-webkit-scrollbar,.fchips::-webkit-scrollbar{display:none}
.sb{position:absolute;right:3px;width:4px;border-radius:2px;background:rgba(130,130,130,.65);opacity:0;transition:opacity .3s;pointer-events:none;z-index:6;display:none}
.sb.on{opacity:1}
.thumb{overflow:hidden}
.thumb svg{position:absolute;inset:0;width:100%;height:100%}
.ch{overflow:hidden}.ch svg{width:100%;height:100%;display:block}
.card{position:relative;overflow:hidden;background:#222;aspect-ratio:9/14;border-radius:12px}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card p{position:absolute;left:0;right:0;bottom:0;padding:44px 10px 10px;background:linear-gradient(transparent,rgba(0,0,0,.78));color:#fff;font-size:13.5px;font-weight:700;line-height:1.35}
.card .more{position:absolute;top:9px;right:8px;display:flex;flex-direction:column;gap:3px}
.card .more i{width:4px;height:4px;border-radius:50%;background:#fff;box-shadow:0 0 3px rgba(0,0,0,.5)}
:focus-visible{outline:3px solid #7aa7ff;outline-offset:2px}
</style>
</head>

4" y="144" font-size="40" font-weight="900" fill="#fff" stroke="#7a3e00" stroke-width="7" paint-order="stroke" stroke-linejoin="round">교육법</text></svg>`, av: `<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="20" fill="#ffd9a0"/><path d="M8 17l2-10 9 6zM32 17l-2-10-9 6z" fill="#f08a2c"/><ellipse cx="20" cy="23" rx="13" ry="11" fill="#f6a04d"/><circle cx="15" cy="22" r="1.900" fill="#2b1a10"/><circle cx="25" cy="22" r="1.900" fill="#2b1a10"/><path d="M18.500 26h3l-1.500 2z" fill="#e8607a"/><path d="M10 11l10-4.500L30 11l-10 4.500z" fill="#222"/><rect x="14.500" y="12" width="11" height="4" fill="#222"/><path d="M30 11v6" stroke="#222" stroke-width="1"/></svg>`}
];
var SHORTS = [  // 쇼츠: 제목, 썸네일(사진)
  {t: "한 번 싸우면 1시간 가는 눈냥즈 #BOYNEXTDOOR #눈냥즈 #낙성", img: IMG_A},
  {t: "덤앤더머 #BOYNEXTDOOR #보이넥스트도어", img: IMG_B}
];
(function () {
  var h = "";
  FEED.forEach(function (f) {
    h += '<div class="thumb">' + f.thumb + '<span class="dur">' + f.dur + '</span></div>' +
      '<div class="meta"><span class="ch">' + f.av + '</span><div><h3>' + f.t + '</h3><p>' + f.ch + '&nbsp; 조회수 ' + f.v + '&nbsp; ' + f.ago + '</p></div></div>';
  });
  h += '<div class="shorts-h"><span><svg width="24" height="26" viewBox="0 0 24 26"><rect x="3" y="1" width="18" height="24" rx="8" fill="#f00"/><path d="M10 9l5.500 4-5.500 4z" fill="#fff"/></svg>Shorts</span><span class="dots"><i></i><i></i><i></i></span></div><div class="cards">';
  SHORTS.forEach(function (c) {
    h += '<div class="card"><img alt="" src="' + c.img + '"><span class="more"><i></i><i></i><i></i></span><p>' + c.t + '</p></div>';
  });
  $("feed").innerHTML = h + '</div>';
})();

/* 프로필 영상 목록 */
VIDEOS.forEach(function (v) {
  var d = document.createElement("div"); d.className = "v";
  d.innerHTML = '<div class="t blank"><span class="dur">' + v[2] + '</span></div><div style="flex:1"><h4>' + full(v) + '</h4><p>' + VIEWS + ' · ' + ago(v[0]) + '</p></div>' + DOTS;
  if (v[0] === PLAY) {
    d.setAttribute("data-play", ""); d.tabIndex = 0; d.setAttribute("role", "button");
    d.onclick = openWatch;
    d.onkeydown = function (e) { if (e.key === "Enter") openWatch(); };
  }
  $("vids").appendChild(d);
});

/* 재생 화면 */
var cur = VIDEOS.filter(function (v) { return v[0] === PLAY; })[0];
$("wtitle").textContent = full(cur);
$("wmeta").innerHTML = '<span style="color:#0f0f0f">' + HANDLE + '</span><span>좋아요 0개</span><span>조회수 ' + VIEWS + '</span><span>' + ago(PLAY) + '</span>';
VIDEOS.filter(function (v) { return v[0] !== PLAY; }).forEach(function (v) {
  var d = document.createElement("div");
  d.innerHTML = '<div class="th"><span class="dur">' + v[2] + '</span></div><div class="meta"><span class="ch mintslot">' + MINT + '</span><div style="flex:1"><h3>' + full(v) + '</h3><p>' + HANDLE.slice(1) + '&nbsp; ▷ ' + VIEWS + '&nbsp; ' + ago(v[0]) + '</p></div>' + DOTS + '</div>';
  $("rel").appendChild(d);
});

var vid = $("vid"), player = $("player"), sk = $("seek");
var hideT, tapT, flT, lastTap = 0, lastSide = 0, dragging = false;
var ARC = '<path d="M20 12a8 8 0 1 1-2.35-5.65"/><path d="M20 4v4h-4"/>';
function skipIcon(back) {
  return '<svg viewBox="0 0 24 24">' + (back ? '<g transform="translate(24 0) scale(-1 1)">' + ARC + '</g>' : ARC) + '<text x="12" y="14.6" text-anchor="middle">10</text></svg>';
}
$("b10").innerHTML = skipIcon(true); $("f10").innerHTML = skipIcon(false);
$("fl1").innerHTML = ARC.replace(/^/, '<g transform="translate(24 0) scale(-1 1)">') + '</g>'; $("fl2").innerHTML = ARC;
var I_PAUSE = '<svg viewBox="0 0 24 24"><rect x="6" y="4.5" width="4" height="15" rx="1"/><rect x="14" y="4.5" width="4" height="15" rx="1"/></svg>';
var I_PLAY = '<svg viewBox="0 0 24 24"><path d="M7 4.5l13 7.5-13 7.5z"/></svg>';
var I_RE = '<svg class="re" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.35-5.65"/><path d="M4 4v4h4"/></svg>';
function mmss(t) { t = Math.max(0, Math.floor(t || 0)); return ("0" + Math.floor(t / 60)).slice(-2) + ":" + ("0" + t % 60).slice(-2); }
function paintPP() {
  $("pp").innerHTML = vid.ended ? I_RE : (vid.paused ? I_PLAY : I_PAUSE);
  $("pp").setAttribute("aria-label", vid.ended ? "다시 재생" : (vid.paused ? "재생" : "일시중지"));
}
function paint() {
  var d = vid.duration || 0, r = d ? Math.min(1, Math.max(0, vid.currentTime / d)) : 0;
  $("fill").style.width = r * 100 + "%"; $("knob").style.left = r * 100 + "%"; $("mini").style.width = r * 100 + "%";
  $("tm").textContent = mmss(vid.currentTime) + " / " + mmss(d);
}
function loop() { paint(); if (!vid.paused && !vid.ended) requestAnimationFrame(loop); }
function armHide() { clearTimeout(hideT); if (!vid.paused && !dragging) hideT = setTimeout(function () { player.classList.remove("ui"); }, 3000); }
function show() { player.classList.add("ui"); armHide(); }
function seekBy(s) { var d = vid.duration || 0; vid.currentTime = Math.min(d, Math.max(0, vid.currentTime + s)); paint(); }
function toggle() {
  if (vid.ended) vid.currentTime = 0;
  if (vid.paused || vid.ended) { var p = vid.play(); if (p && p.catch) p.catch(function () {}); } else vid.pause();
  show();
}
function flash(side) {
  var e = document.querySelector(side < 0 ? ".fl.l" : ".fl.r");
  e.classList.remove("on"); void e.offsetWidth; e.classList.add("on");
}
vid.addEventListener("play", function () { paintPP(); loop(); armHide(); });
vid.addEventListener("pause", function () { paintPP(); paint(); clearTimeout(hideT); });
vid.addEventListener("ended", function () { paintPP(); paint(); player.classList.add("ui"); });
["loadedmetadata", "timeupdate", "seeked"].forEach(function (n) { vid.addEventListener(n, paint); });
$("pp").onclick = toggle;
$("b10").onclick = function () { seekBy(-10); show(); };
$("f10").onclick = function () { seekBy(10); show(); };
$("min").onclick = closeWatch;
player.addEventListener("click", function (e) {
  if (e.target.closest("button,#seek")) return;
  var r = player.getBoundingClientRect(), x = (e.clientX - r.left) / r.width;
  var side = x < .35 ? -1 : x > .65 ? 1 : 0, now = Date.now();
  if (side && side === lastSide && now - lastTap < 350) {      // 양옆 두 번 탭 = 10초 이동
    clearTimeout(tapT); seekBy(side * 10); flash(side); lastTap = now; return;
  }
  lastSide = side; lastTap = now; clearTimeout(tapT);
  tapT = setTimeout(function () {
    if (player.classList.contains("ui") && !vid.paused) player.classList.remove("ui"); else show();
  }, 350);
});
function ratio(e) { var r = sk.getBoundingClientRect(); return Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)); }
function drag(e) { if (dragging && vid.duration) { vid.currentTime = ratio(e) * vid.duration; paint(); } }
sk.addEventListener("pointerdown", function (e) {
  if (!player.classList.contains("ui")) return;
  dragging = true; clearTimeout(hideT); sk.setPointerCapture(e.pointerId); drag(e);
});
sk.addEventListener("pointermove", drag);
function endDrag() { if (dragging) { dragging = false; armHide(); } }
sk.addEventListener("pointerup", endDrag); sk.addEventListener("pointercancel", endDrag);
function openWatch() {
  go("watch"); vid.currentTime = 0; paintPP(); paint(); show();
  var p = vid.play(); if (p && p.catch) p.catch(function () { paintPP(); });
}
function closeWatch() { vid.pause(); go("profile"); }
paintPP();

/* 영상 위에 겹쳐서 보이는 스크롤바 (가로폭을 차지하지 않음) */
document.querySelectorAll(".scroll").forEach(function (sc) {
  var sb = document.createElement("div"); sb.className = "sb"; sc.parentNode.appendChild(sb);
  var t;
  function upd() {
    var ch = sc.clientHeight, sh = sc.scrollHeight;
    if (sh <= ch + 1) { sb.style.display = "none"; return; }
    var h = Math.max(36, ch * ch / sh);
    sb.style.display = "block"; sb.style.height = h + "px";
    sb.style.top = sc.offsetTop + (sc.scrollTop / (sh - ch)) * (ch - h) + "px";
  }
  function flashSb() { upd(); sb.classList.add("on"); clearTimeout(t); t = setTimeout(function () { sb.classList.remove("on"); }, 1100); }
  sc.addEventListener("scroll", flashSb);
  sc.addEventListener("pointerenter", flashSb);
  window.addEventListener("resize", upd);
  sc._flash = flashSb;
});

function tick() { var d = new Date(); $("time").textContent = ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2); }
tick(); setInterval(tick, 20000);
</script>
